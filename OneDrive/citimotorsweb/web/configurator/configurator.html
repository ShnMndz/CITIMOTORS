<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Configurator</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="configurator.css">
<style>

</style>
</head>
<body>

<div class="container my-5">
  <div class="row">
    <!-- IMAGE -->
    <div class="col-md-6">
        <img id="carImage" src="" class="car-img">
    </div>

    <!-- CONFIG -->
    <div class="col-md-6 config-box">
        <h3 id="carName"></h3>

        <!-- VARIANT -->
        <label class="mt-3">Variant</label>
        <select id="variant" class="form-select"></select>

        <!-- COLOR SELECTION -->
        <label class="mt-3">Color</label>
        <div class="d-flex gap-3 mt-2" id="colorGroup"></div>

        <!-- PRICE -->
        <h4 class="mt-4">Total Price:</h4>
        <h2 id="totalPrice">₱0</h2>

        <button class="btn btn-dark mt-3 w-100">Reserve Now</button>
    </div>
  </div>
</div>

<script>
// CAR DATA (all colors now have name + code)
const cars = {
  destinator: {
    name: "DESTINATOR",
    price: 1939000,
    image: "../img/cv1.png",
    variants: [
      { name: "GT 1.5L Unleaded 2WD Automatic CVT", price: 1939000 },
      { name: "GLS 1.5L Automatic CVT", price: 1599000 },
      { name: "GLX 1.5L Automatic CVT", price: 1389000 }
    ],
    colors: [
      { name: "Quartz White Pearl", code: "white" },
      { name: "Blade Silver Metallic", code: "silver" },
      { name: "Red Metallic", code: "red" },
      { name: "Graphite Gray Metallic", code: "gray" }
    ]
  },
  l300: {
    name: "L300 FB EXCEED",
    price: 1939000,
    image: "../img/cv2.png",
    variants: [
      { name: "L300 FB EXCEED W/ DUAL A/C", price: 1939000 },
      { name: "L300 FB EXCEED W/ FRONT A/C", price: 1599000 },
      { name: "L300 EXCEED C/C 2.2D DSL MTT", price: 1389000 }
    ],
    colors: [
      { name: "Pearl White", code: "white" },
      { name: "Deep Ocean Blue", code: "blue" },
      { name: "Steel Gray", code: "gray" }
    ]
  },
  monterosport: {
    name: "MONTERO SPORT",
    price: 2482000,
    image: "../img/cv3.png",
    variants: [
      { name: "BLACK SERIES 2.4D 4WD AT", price: 2482000 },
      { name: "GLS 2.4D B/S RALLIART 2WD AT", price: 2225000 },
      { name: "BLACK SERIES 2.4D 2WD AT", price: 2080000 },
      { name: "GLS 2.4D 2WD AT", price: 1799000 },
      { name: "GLX 2.4D 2WD MT", price: 1303000 }
    ],
    colors: [
      { name: "White Diamond", code: "white" },
      { name: "Jet Black Mica", code: "black" },
      { name: "Graphite Gray Metallic", code: "gray" }
    ]
  },
   triton: {
    name: "TRITON",
    price: 1909000,
    image: "../img/cv3.png",
    variants: [
      { name: "TRITON ATHLETE 2.4D 4WD AT", price: 1909000 },
      { name: "TRITON GLS 2.4D 2WD AT", price: 1582000 },
      { name: "TRITON GLX 2.4D 4WD MT", price: 1531000 },
      { name: "TRITON GLX 2.4D 2WD AT", price: 1303000 },
      { name: "TRITON GLX 2.4D 2WD MT", price: 1251000 },
      { name: "TRITON GL 2.4D 4WD MT", price: 1157000 },
      { name: "TRITON GL 2.4D 2WD MT", price: 1134000 }
    ],
    colors: [
      { name: "Red Solid", code: "red" },
      { name: "Blade Silver Metallic", code: "silver" },
      { name: "White Diamond", code: "white" },
      { name: "Graphite Gray Mettalic", code: "gray" }
    ]
  }
  
};

// GET CAR FROM URL
const params = new URLSearchParams(window.location.search);
const carKey = params.get("car") || "destinator";
const carData = cars[carKey];

// POPULATE PAGE
document.getElementById("carName").innerText = carData.name;
document.getElementById("carImage").src = carData.image;

// Generate variant select options
const variantSelect = document.getElementById("variant");
carData.variants.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.price;
    opt.textContent = v.name;
    variantSelect.appendChild(opt);
});

// Generate color buttons
const colorGroup = document.getElementById("colorGroup");
carData.colors.forEach(color => {
    const div = document.createElement("div");
    div.classList.add("color-option");
    div.setAttribute("data-color", color.code);

    const circle = document.createElement("div");
    circle.classList.add("color-btn");
    circle.style.background = color.code; // actual color

    const label = document.createElement("small");
    label.textContent = color.name; // friendly label

    div.appendChild(circle);
    div.appendChild(label);
    colorGroup.appendChild(div);

    // selection highlight and logging
    div.addEventListener("click", () => {
        document.querySelectorAll(".color-option").forEach(o => o.classList.remove("selected"));
        div.classList.add("selected");
        console.log("Selected color:", color.name, color.code);
    });
});

// BASE PRICE
let basePrice = carData.price;

// PRICE UPDATE
function updatePrice() {
    const variantPrice = parseInt(document.getElementById("variant").value) || 0;
    const total = basePrice + variantPrice;
    document.getElementById("totalPrice").innerText = "₱" + total.toLocaleString();
}

// EVENTS
variantSelect.addEventListener("change", updatePrice);

// INIT
updatePrice();
</script>

</body>
</html>
