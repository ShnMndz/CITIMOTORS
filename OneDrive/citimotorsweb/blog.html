<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book a Test Drive</title>

<link rel="stylesheet" href="../css/testdrive.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- HERO -->
<section class="hero">
    <p class="breadcrumb">HOME > TEST DRIVE</p>

    <h1>Book a test drive</h1>

    <p class="subtitle">
        Want to experience the thrill of driving your very own Mitsubishi?
        Simply select a model, then share your contact details and request a time.
    </p>
</section>

<!-- SELECT CAR -->
<section class="car-select container">

<h3 class="text-center mb-5">1. Select a car</h3>

<div class="row text-center g-4">

<!-- XPANDER -->
<div class="col-md-4">
<div class="car-card">

<img src="../img/xpander.png" class="img-fluid">

<h5>XPANDER</h5>
<p>From ₱1,099,000</p>

</div>
</div>

<!-- MONTERO -->
<div class="col-md-4">
<div class="car-card">

<img src="../img/montero.png" class="img-fluid">

<h5>MONTERO SPORT</h5>
<p>From ₱1,568,000</p>

</div>
</div>

<!-- MIRAGE -->
<div class="col-md-4">
<div class="car-card">

<img src="../img/mirage.png" class="img-fluid">

<h5>MIRAGE</h5>
<p>From ₱720,000</p>

</div>
</div>

</div>

</section>

</body>
</html>
